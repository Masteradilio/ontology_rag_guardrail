name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: >-
          python -m ruff check --select E4,E7,E9,F
          src/quimera_semantic_trust_guardrail/evaluation
          tests/product/test_rag_evals.py
          tests/product/test_rag_benchmark.py
          tests/product/test_observability.py
          tests/product/test_replay.py
          tests/product/test_llm_rag_benchmark.py
          tests/product/test_phase_s0_evaluation_infrastructure.py
      - run: >-
          python -m mypy src/quimera_semantic_trust_guardrail/evaluation
          --ignore-missing-imports --follow-imports=skip
      - run: >-
          python -m pytest tests/product --cov=quimera_semantic_trust_guardrail
          --cov-report=term --cov-fail-under=60
