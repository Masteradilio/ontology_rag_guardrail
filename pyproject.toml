[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quimera-semantic-trust-guardrail"
version = "0.1.0.dev0"
description = "Auditable trivalent semantic trust guardrail for enterprise LLM, RAG, and agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU Affero General Public License v3 or later (AGPLv3+)" }
keywords = [
  "guardrail",
  "semantic-trust",
  "rag",
  "llm",
  "agent",
  "trivalent",
  "audit",
  "proof-ledger",
  "ontology",
  "lgpd",
  "ai-act",
]
authors = [
  { name = "Projeto Quimera" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "networkx>=3.2",
  "pandas>=2.2",
  "pypdf>=4.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "mypy>=1.15"
]
evaluation = [
  "sentence-transformers==5.6.1"
]
fastapi = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27"
]

[project.urls]
Homepage = "https://github.com/Masteradilio/ontology_rag_guardrail"
Documentation = "https://github.com/Masteradilio/ontology_rag_guardrail#readme"
Source = "https://github.com/Masteradilio/ontology_rag_guardrail"
Issues = "https://github.com/Masteradilio/ontology_rag_guardrail/issues"
Changelog = "https://github.com/Masteradilio/ontology_rag_guardrail/blob/main/CHANGELOG.md"

[project.scripts]
quimera = "quimera_semantic_trust_guardrail.__main__:main"
quimera-serve = "quimera_semantic_trust_guardrail.__main__:serve_main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "core*",
  "quimera_semantic_trust_guardrail*",
  "groundcite*",
  "quimera_legacy*",
]

[tool.setuptools]
py-modules = [
  "bounded_reasoning",
  "knowledge_ontology",
  "llm_hypothesis_parser",
  "proof_ledger",
  "qgsl_core",
  "symbolic_inference",
  "truth_mapping",
  "validation_cascade",
]

[tool.setuptools.package-data]
quimera_semantic_trust_guardrail = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
