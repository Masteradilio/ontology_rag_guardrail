[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quimera-semantic-trust-guardrail"
version = "0.1.0.dev0"
description = "Auditable trivalent semantic trust guardrail for enterprise LLM, RAG, and agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Projeto Quimera" }
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "networkx>=3.2",
  "pandas>=2.2",
  "pypdf>=4.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
